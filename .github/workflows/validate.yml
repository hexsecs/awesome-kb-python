name: Validate OpenShelf KB
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenShelf
        run: pip install 'git+https://github.com/OpenNorms/openshelf.git'
      - name: Validate import
        run: python tools/check.py
      - name: Lint OpenShelf contract
        run: openshelf lint .
      - name: Check reproducible ingest
        run: |
          python tools/ingest.py --date 2026-11-04
          git diff --exit-code
